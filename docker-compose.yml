services:
  tofa-collection-creator:
    image: ghcr.io/ferdinand99/tofa-collection-creator:latest
    build: .
    container_name: tofa-collection-creator
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config
    environment:
      TOFA_URL: ${TOFA_URL}
      TOFA_API_KEY: ${TOFA_API_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:-}
      TZ: ${TZ:-Europe/Oslo}
