name: Docker image (main)

# Rolling development image. Every push to main publishes :edge and :sha-<short>.
# Stable releases (:latest, :X.Y.Z, :X.Y) are handled by release-please.yml.
# Pull requests only build, to validate the Dockerfile.

on:
  push:
    branches: [main]
    # Docs, template and licence-only commits do not change the image.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'unraid/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  validate:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          provenance: false

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=edge
          # Plain Docker (schema 2) manifest: Unraid's "check for updates" cannot read the
          # OCI index that provenance attestations would add.
          provenance: false
